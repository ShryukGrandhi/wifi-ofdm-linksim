name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install GNU Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends octave
          octave-cli --version | head -1

      - name: Run tests
        run: octave-cli --no-gui --eval "addpath('tests'); n = run_all_tests(); exit(double(n > 0));"

      - name: Run benchmark (quick mode)
        run: octave-cli --no-gui --eval "addpath('bench'); run_benchmark('quick');"
